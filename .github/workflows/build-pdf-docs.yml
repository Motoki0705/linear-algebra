name: Build LaTeX PDFs

on:
  push:
    branches: [main]
    paths:
      - 'tex/**/*.tex'
      - 'scripts/normalize_tex.py'
      - '.github/workflows/build-pdf-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-luatex texlive-lang-japanese \
            texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Normalize TeX mathematical notation
        run: python3 scripts/normalize_tex.py

      - name: Build and render-check every PDF
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' texfile; do
            rel="${texfile#tex/}"
            pdf="${rel%.tex}.pdf"
            mkdir -p "$(dirname "$pdf")"

            build_dir="$(mktemp -d)"
            latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -outdir="$build_dir" "$texfile"
            built="$build_dir/$(basename "${texfile%.tex}.pdf")"
            test -s "$built"
            cp "$built" "$pdf"

            pdfinfo "$pdf" >/dev/null
            pdftoppm -f 1 -singlefile -png -r 120 \
              "$pdf" "$build_dir/render" >/dev/null 2>&1
            test -s "$build_dir/render.png"
            rm -rf "$build_dir"
            count=$((count + 1))
          done < <(find tex -type f -name '*.tex' -print0)

          echo "Built and render-checked $count PDFs."
          test "$count" -gt 0

      - name: Verify source and output correspondence
        shell: bash
        run: |
          set -euo pipefail
          tex_count="$(find tex -type f -name '*.tex' | wc -l)"
          pdf_count="$(find . -type f -name '*.pdf' -not -path './tex/*' | wc -l)"
          md_count="$(find . -type f -name '*.md' -not -path './.git/*' | wc -l)"
          echo "TeX: $tex_count, PDF: $pdf_count, Markdown: $md_count"
          test "$tex_count" -eq "$pdf_count"
          test "$md_count" -eq 0
          while IFS= read -r -d '' texfile; do
            rel="${texfile#tex/}"
            test -s "${rel%.tex}.pdf"
          done < <(find tex -type f -name '*.tex' -print0)

      - name: Commit normalized sources and rebuilt PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'docs: normalize TeX math and rebuild PDFs'
          git push origin HEAD:main
